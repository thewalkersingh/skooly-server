spring:
  application:
    name: skooly
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /api
  multipart:
    enabled: true
    max-file-size: 5MB
    max-request-size: 10MB


  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

management:
  endpoints:
    web:
      exposure:
        include: mappings


# ── JWT ───────────────────────────────────────────────────────────────────────
jwt:
  access-token-expiry: 36000000        # default 15 minutes
  refresh-token-expiry: 604800000    # default 7 days

# ── OTP ───────────────────────────────────────────────────────────────────────
otp:
  expiry-minutes: 5
  length: 6

# ── CORS ─────────────────────────────────────────────────────────────────────
cors:
  allowed-origins: http://localhost:5173,https://your-app.vercel.app