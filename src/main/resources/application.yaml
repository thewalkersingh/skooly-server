server:
  port: 8080

spring:
  application:
    name: skooly

  datasource:
    url: jdbc:mysql://localhost:3306/skooly_db?useSSL=false&serverTimezone=UTC
    username: root
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

      flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

#  jwt:
#    secret: your_jwt_secret_key_here_make_it_long_and_secure
#    expiration: 86400000       # 1 day in ms
#    refresh-expiration: 604800000  # 7 days in ms

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    com.educore: DEBUG
    org.springframework.security: DEBUG