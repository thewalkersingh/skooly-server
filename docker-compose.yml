version: '3.8'

services:
  skooly-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skooly-api
    ports:
      - "8080:8080"
    environment:
      # Database
      DB_URL: jdbc:mysql://mysql-thewa-skooly.h.aivencloud.com:13758/defaultdb?ssl-mode=REQUIRED&useSSL=true&requireSSL=true&verifyServerCertificate=false
      DB_USERNAME: avnadmin
      DB_PASSWORD: ${DB_PASSWORD}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY: 900000
      JWT_REFRESH_EXPIRY: 604800000

      # Mail
      MAIL_HOST: smtp.sendgrid.net
      MAIL_PORT: 587
      MAIL_USERNAME: apikey
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      # CORS
      CORS_ORIGINS: https://skooly.vercel.app,http://localhost:5173

      # Profile
      SPRING_PROFILES_ACTIVE: prod

    restart: unless-stopped